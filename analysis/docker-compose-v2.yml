# NET/ROM analysis stack v2: multi-port backbone nodes + interference links.
#
# 1 net-sim (14 ports: 10 VHF + 4 UHF) + 10 LinBPQ nodes.
# Backbone nodes (n1, n4, n6, n8) have 2 KISS ports each.

services:
  net-sim:
    image: ghcr.io/packethacking/net-sim:main
    network_mode: host
    volumes:
      - ../configs/netrom-analysis-10v2.yaml:/etc/sim/network.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 2s
      timeout: 2s
      retries: 60

  n1:
    image: m0lte/linbpq:latest
    network_mode: host
    volumes:
      - ./nodes/n1:/data
    depends_on:
      net-sim:
        condition: service_healthy
    restart: on-failure

  n2:
    image: m0lte/linbpq:latest
    network_mode: host
    volumes:
      - ./nodes/n2:/data
    depends_on:
      net-sim:
        condition: service_healthy
    restart: on-failure

