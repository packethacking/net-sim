name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr
        # Skip on PR builds: forks don't have ghcr push, and we don't
        # want PRs publishing into the package namespace anyway.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # main → :main and :main-<sha>
          # v1.2.3 → :v1.2.3, :1.2, :1, :latest
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Resolve samoyed's current main HEAD SHA so it can be passed
      # as a build-arg. Without this, the Dockerfile's
      #   RUN git clone --depth 1 --branch main https://...samoyed.git
      # is a layer whose command text never changes — GHA cache hits it
      # every build and the bundled samoyed snapshot gets frozen at
      # whatever it was the first time the layer ran. Pinning to a SHA
      # in the build-args changes the layer's cache key whenever
      # samoyed/main moves, so we pick up bugfixes in lockstep.
      - name: Resolve samoyed main SHA
        id: samoyed
        run: |
          sha=$(curl -fsSL \
            -H "Accept: application/vnd.github.v3.sha" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/doismellburning/samoyed/commits/main)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "samoyed main = $sha"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            SAMOYED_REF=${{ steps.samoyed.outputs.sha }}
          # PR builds verify the Dockerfile still works but don't publish.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
