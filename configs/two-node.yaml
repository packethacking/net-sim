# Smoke-test config: two nodes, one port each, bidirectional AFSK1200 link.
# Used by Phase 2 acceptance — send a KISS frame to A's KISS port, expect
# it to come out of B's KISS port.
mixer_mode: fm_capture
capture_db: 6.0
collision_mode: silence

nodes:
  - id: a
    callsign: SIMA
    ports:
      - id: vhf
        modem: { mode: afsk1200 }
        kiss_port: 8001
  - id: b
    callsign: SIMB
    ports:
      - id: vhf
        modem: { mode: afsk1200 }
        kiss_port: 8002

links:
  - { from: a.vhf, to: b.vhf, loss_db: 0 }
  - { from: b.vhf, to: a.vhf, loss_db: 0 }
