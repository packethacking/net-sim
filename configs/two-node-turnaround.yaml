# Two-node topology with radio turnaround modeling.
#
# Both nodes use the baofeng-uv5r profile: 300 ms TX-to-RX turnaround
# (receiver deaf after transmitting) and 150 ms RX-to-TX turnaround
# (PA ramp-up eats into the preamble). This topology is useful for
# testing whether your TXDELAY setting is long enough to survive a slow
# radio's turnaround.
#
# Built-in profiles: ideal, kenwood-th-d74, yaesu-ftm-400,
#                    baofeng-uv5r, generic-ht
mixer_mode: fm_capture
capture_db: 6.0
collision_mode: silence

nodes:
  - id: a
    ports:
      - id: vhf
        modem: { mode: afsk1200 }
        kiss_port: 8001
        profile: baofeng-uv5r
  - id: b
    ports:
      - id: vhf
        modem: { mode: afsk1200 }
        kiss_port: 8002
        profile: baofeng-uv5r

links:
  - { from: a.vhf, to: b.vhf, loss_db: 6 }
  - { from: b.vhf, to: a.vhf, loss_db: 6 }
