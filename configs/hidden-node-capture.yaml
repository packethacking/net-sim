# Hidden-node demo, asymmetric levels (A captures).
#
# Same topology as hidden-node.yaml — A and C cannot hear each other, both
# are heard by B — but A is much louder at B than C is. When both transmit
# at the same time, B's mixer sees a 12 dB margin between the two signals;
# 12 dB ≥ the 6 dB capture threshold, so A "captures" the demodulator and
# its frames decode cleanly. C is suppressed despite transmitting.
#
# This is the configuration-driven proof that the FM capture effect is
# what makes packet usable on shared-channel VHF in the real world.
mixer_mode: fm_capture
capture_db: 6.0
collision_mode: silence

nodes:
  - id: a
    callsign: SIMA
    ports:
      - id: vhf
        modem: { mode: afsk1200 }
        kiss_port: 8001
  - id: b
    callsign: SIMB
    ports:
      - id: vhf
        modem: { mode: afsk1200 }
        kiss_port: 8002
  - id: c
    callsign: SIMC
    ports:
      - id: vhf
        modem: { mode: afsk1200 }
        kiss_port: 8003

links:
  # A ↔ B at -3 dB
  - { from: a.vhf, to: b.vhf, loss_db: 3 }
  - { from: b.vhf, to: a.vhf, loss_db: 3 }
  # B ↔ C at -15 dB
  - { from: b.vhf, to: c.vhf, loss_db: 15 }
  - { from: c.vhf, to: b.vhf, loss_db: 15 }
  # A — C: hidden from each other.
