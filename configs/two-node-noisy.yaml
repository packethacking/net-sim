# Same as two-node.yaml but with deliberate path loss + channel noise.
# Phase 4 acceptance: frame error rate climbs when SNR is reduced.
#
# loss_db has to be non-zero so the signal isn't clipping at full scale —
# samoyed transmits at peak 32767, which saturates int16 output and is
# essentially immune to additive noise (the bit decisions still work fine
# even when sigma is high). 20 dB attenuation drops the signal RMS to a
# level where the noise floor is meaningfully competing.
#
# Empirical FER from this config (1200-baud AFSK, 20 frames, 0.4 s spacing):
#   loss=20, noise=0   → 0%   (sanity check, no noise)
#   loss=20, noise=20  → ~20% (degraded but mostly OK)
#   loss=20, noise=18  → ~75% (badly degraded)
#   loss=30, noise=24  → 100% (channel unusable)
#
# This demo uses noise_db=20 so frames mostly get through but you can see
# the FER move on each run. Tune for your point.
mixer_mode: fm_capture
capture_db: 6.0
collision_mode: silence

nodes:
  - { id: a, callsign: SIMA, ports: [{ id: vhf, modem: { mode: afsk1200 }, kiss_port: 8001 }] }
  - { id: b, callsign: SIMB, ports: [{ id: vhf, modem: { mode: afsk1200 }, kiss_port: 8002 }] }

links:
  - { from: a.vhf, to: b.vhf, loss_db: 20, noise_db: 20 }
  - { from: b.vhf, to: a.vhf, loss_db: 20, noise_db: 20 }
