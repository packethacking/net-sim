# Three-node fully connected mesh, AFSK1200, equal loss everywhere.
# Every node hears every other.
mixer_mode: fm_capture
capture_db: 6.0
collision_mode: silence

nodes:
  - id: a
    callsign: SIMA
    ports:
      - id: vhf
        modem: { mode: afsk1200 }
        kiss_port: 8001
  - id: b
    callsign: SIMB
    ports:
      - id: vhf
        modem: { mode: afsk1200 }
        kiss_port: 8002
  - id: c
    callsign: SIMC
    ports:
      - id: vhf
        modem: { mode: afsk1200 }
        kiss_port: 8003

links:
  - { from: a.vhf, to: b.vhf, loss_db: 0 }
  - { from: b.vhf, to: a.vhf, loss_db: 0 }
  - { from: a.vhf, to: c.vhf, loss_db: 0 }
  - { from: c.vhf, to: a.vhf, loss_db: 0 }
  - { from: b.vhf, to: c.vhf, loss_db: 0 }
  - { from: c.vhf, to: b.vhf, loss_db: 0 }
