# Linear chain of 6 AFSK1200 stations: A — B — C — D — E — F.
# Each station hears only its immediate neighbours.
mixer_mode: fm_capture
capture_db: 6.0
collision_mode: silence

nodes:
  - { id: a, callsign: SIMA, ports: [{ id: vhf, modem: { mode: afsk1200 }, kiss_port: 8001 }] }
  - { id: b, callsign: SIMB, ports: [{ id: vhf, modem: { mode: afsk1200 }, kiss_port: 8002 }] }
  - { id: c, callsign: SIMC, ports: [{ id: vhf, modem: { mode: afsk1200 }, kiss_port: 8003 }] }
  - { id: d, callsign: SIMD, ports: [{ id: vhf, modem: { mode: afsk1200 }, kiss_port: 8004 }] }
  - { id: e, callsign: SIME, ports: [{ id: vhf, modem: { mode: afsk1200 }, kiss_port: 8005 }] }
  - { id: f, callsign: SIMF, ports: [{ id: vhf, modem: { mode: afsk1200 }, kiss_port: 8006 }] }

links:
  - { from: a.vhf, to: b.vhf, loss_db: 0 }
  - { from: b.vhf, to: a.vhf, loss_db: 0 }
  - { from: b.vhf, to: c.vhf, loss_db: 0 }
  - { from: c.vhf, to: b.vhf, loss_db: 0 }
  - { from: c.vhf, to: d.vhf, loss_db: 0 }
  - { from: d.vhf, to: c.vhf, loss_db: 0 }
  - { from: d.vhf, to: e.vhf, loss_db: 0 }
  - { from: e.vhf, to: d.vhf, loss_db: 0 }
  - { from: e.vhf, to: f.vhf, loss_db: 0 }
  - { from: f.vhf, to: e.vhf, loss_db: 0 }
