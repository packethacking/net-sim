# Multi-port node demo. The middle node has *two* radios on different
# bands; one peer hooks up over each band.
#
# Note: the original PLAN sketch imagined a VHF+AFSK1200 / UHF+GFSK9600
# pairing. Today's samoyed config-file MODEM directive doesn't reliably
# switch to GFSK9600 (see NOTES-audio-io.md), but the CLI flag path does.
# The router uses CLI flags so the GFSK side works — but the demo here
# uses two AFSK1200 ports on the middle node so the moving parts under
# test are the *port multiplicity*, not the modem variety. Swap to
# `gfsk9600` on `middle.uhf` and the matching `f.vhf` once you want to
# exercise mixed-modem.
mixer_mode: fm_capture
capture_db: 6.0
collision_mode: silence

nodes:
  - id: a
    callsign: SIMA
    ports:
      - id: vhf
        modem: { mode: afsk1200 }
        kiss_port: 8001

  - id: middle
    callsign: HUB
    ports:
      - id: vhf
        modem: { mode: afsk1200 }
        kiss_port: 8002
      - id: uhf
        modem: { mode: afsk1200 }
        kiss_port: 8003

  - id: b
    callsign: SIMB
    ports:
      - id: vhf
        modem: { mode: afsk1200 }
        kiss_port: 8004

links:
  # a ↔ middle.vhf
  - { from: a.vhf, to: middle.vhf, loss_db: 0 }
  - { from: middle.vhf, to: a.vhf, loss_db: 0 }
  # b ↔ middle.uhf
  - { from: b.vhf, to: middle.uhf, loss_db: 0 }
  - { from: middle.uhf, to: b.vhf, loss_db: 0 }
  # No cross-coupling between middle.vhf and middle.uhf — different
  # frequencies, different radios, independent paths. The router enforces
  # this by simply not having a link between them.
